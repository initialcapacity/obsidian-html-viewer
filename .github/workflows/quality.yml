name: Quality

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Check on Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22.22.0', '24']
    steps:
      - name: Check out the pull request
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Use supported Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies from the lockfile
        run: npm ci --ignore-scripts

      - name: Run lint, compatibility checks, coverage, and build
        run: npm run check

      - name: Install browser engines
        if: matrix.node-version == '24'
        run: npx playwright install --with-deps chromium webkit

      - name: Run browser security tests
        if: matrix.node-version == '24'
        run: npm run test:e2e
