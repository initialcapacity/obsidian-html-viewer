<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Self-contained HTML fixture</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; }
    body { background: #f3f7ff; color: #172554; margin: 0; padding: 2rem; }
    main { background: white; border: 4px solid #2563eb; border-radius: 1rem; margin: auto; max-width: 44rem; padding: 2rem; }
    h1 { color: #1d4ed8; font-size: 2.5rem; margin-top: 0; }
    .proof { align-items: center; display: flex; gap: 1rem; }
    .proof img { image-rendering: pixelated; width: 64px; height: 64px; }
    .badge { background: #dcfce7; border: 2px solid #16a34a; border-radius: 999px; color: #166534; display: inline-block; font-weight: 700; padding: .5rem 1rem; }
  </style>
</head>
<body>
  <main>
    <h1>HTML Document Viewer works</h1>
    <h2>Self-contained .html fixture</h2>
    <div class="proof">
      <img alt="Embedded green proof square" width="64" height="64" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQAQMAAAAlPW0iAAAAA1BMVEUixV6m7fCsAAAADElEQVQI12NgIA0AAAAwAAHHqoWOAAAAAElFTkSuQmCC">
      <p class="badge">Inline CSS and a data image rendered</p>
    </div>
    <p><a href="#finish">Jump to the fragment-only link proof</a></p>
    <p id="finish">End of the self-contained document.</p>
  </main>
</body>
</html>
